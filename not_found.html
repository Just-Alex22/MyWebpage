<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Just_Alex's website</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: system-ui, 'Segoe UI', sans-serif;
  background: #000;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 2.5rem 1rem 3rem;
}

#bg {
  position: fixed;
  inset: 0;
  width: 100%; height: 100%;
  border: none;
  z-index: 0;
  pointer-events: none;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(40px); }
  to   { opacity: 1; transform: translateY(0); }
}

#panel {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 820px;
  background: rgba(10,10,10,0.84);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 16px;
  overflow: hidden;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 8px 48px rgba(0,0,0,0.75);
  opacity: 0;
  animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 1s forwards;
}

/* HEADER */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.4rem 2rem 1rem;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  flex-wrap: wrap;
  gap: 0.75rem;
}

.header-left { display: flex; align-items: center; gap: 1rem; }

.avatar {
  width: 50px; height: 50px;
  border-radius: 10px;
  background: #1c1c1c;
  border: 1px solid rgba(255,255,255,0.13);
  overflow: hidden;
  flex-shrink: 0;
}
.avatar img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}

.hname { font-size: 22px; font-weight: 700; color: #f0f0f0; }
.hsub  { font-size: 12px; color: #444; font-family: 'JetBrains Mono', monospace; margin-top: 1px; }

.back-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 15px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05);
  color: #888;
  font-size: 14px;
  font-family: inherit;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.15s;
}
.back-btn:hover {
  color: #ddd;
  background: rgba(255,255,255,0.09);
  border-color: rgba(255,255,255,0.18);
}

/* CONTENT */
main {
  padding: 4rem 2rem 4.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.err-code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 96px;
  font-weight: 600;
  color: #1e1e1e;
  line-height: 1;
  margin-bottom: 0.5rem;
  letter-spacing: -4px;
  user-select: none;
}

.err-divider {
  width: 40px;
  height: 1px;
  background: rgba(255,255,255,0.1);
  margin: 1.25rem auto;
}

.err-title {
  font-size: 18px;
  font-weight: 600;
  color: #bbb;
  margin-bottom: 0.6rem;
}

.err-desc {
  font-size: 14px;
  color: #444;
  line-height: 1.7;
  max-width: 340px;
  font-family: 'JetBrains Mono', monospace;
}
.err-desc span { color: #666; }

.err-link {
  margin-top: 2.5rem;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 20px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.04);
  color: #777;
  font-size: 13px;
  font-family: 'JetBrains Mono', monospace;
  text-decoration: none;
  transition: all 0.15s;
}
.err-link:hover {
  color: #ddd;
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.18);
}

/* FOOTER */
footer {
  padding: 0.85rem 2rem;
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px;
  color: #333;
  font-family: 'JetBrains Mono', monospace;
}
footer a { color: #444; text-decoration: none; }
footer a:hover { color: #888; }

@media (max-width: 580px) {
  header { padding: 1rem 1.2rem; }
  main   { padding: 3rem 1.2rem 3.5rem; }
  .err-code { font-size: 64px; }
}
</style>
</head>
<body>

<iframe id="bg" src="cubo_nieve.html" title="background"></iframe>

<div id="panel">

  <header>
    <div class="header-left">
      <div class="avatar"><img src="mii.png" alt="Just_Alex"></div>
      <div>
        <div class="hname">Just_Alex</div>
        <div class="hsub">personal website</div>
      </div>
    </div>
    <a class="back-btn" href="index.html">&#8592; Go back home</a>
  </header>

  <main>
    <div class="err-code">404</div>
    <div class="err-divider"></div>
    <div class="err-title">Page not found</div>
    <div class="err-desc">
      The page you're looking for doesn't exist or has been moved.<br>
      <span>~ /dev/null</span>
    </div>
    <a class="err-link" href="index.html">&#8592; Return to index</a>
  </main>

  <footer>
    <span>&copy; 2026 <a href="index.html">Just_Alex</a></span>
    <span><a href="https://github.com/Just-Alex22" target="_blank">github.com/Just-Alex22</a></span>
  </footer>

</div>

</body>
</html>
