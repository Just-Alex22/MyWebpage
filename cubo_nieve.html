<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cubo 3D con Nieve</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100vh; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const DPR = window.devicePixelRatio || 1;
let W, H, FOV;

function resize() {
  W = canvas.offsetWidth;
  H = canvas.offsetHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.scale(DPR, DPR);
  FOV = Math.min(W, H) * 0.9;
  resetSnow();
}

window.addEventListener('resize', resize);

const CAM_X = 30 * Math.PI / 180;
let angle = 0;

function cubeSize() { return Math.min(W, H) * 0.15; }

function getVerts() {
  const s = cubeSize();
  return [
    [-s,-s,-s],[ s,-s,-s],[ s, s,-s],[-s, s,-s],
    [-s,-s, s],[ s,-s, s],[ s, s, s],[-s, s, s],
  ];
}

const edges = [
  [0,1],[1,2],[2,3],[3,0],
  [4,5],[5,6],[6,7],[7,4],
  [0,4],[1,5],[2,6],[3,7],
];
const faces = [
  [0,1,2,3],[4,5,6,7],
  [0,1,5,4],[2,3,7,6],
  [1,2,6,5],[0,3,7,4],
];

function rotateX(x,y,z,a){ return [x, y*Math.cos(a)-z*Math.sin(a), y*Math.sin(a)+z*Math.cos(a)]; }
function rotateY(x,y,z,a){ return [x*Math.cos(a)+z*Math.sin(a), y, -x*Math.sin(a)+z*Math.cos(a)]; }
function applyCamera(x,y,z){ return rotateX(x,y,z,CAM_X); }
function project(x,y,z){
  const depth = FOV + z + Math.min(W,H)*0.55;
  const scale = FOV / depth;
  return { sx: W/2 + x*scale, sy: H/2 + y*scale + H*0.03, z };
}

let snow = [];
function resetSnow() {
  const count = Math.floor((W * H) / 2800);
  snow = Array.from({length: count}, () => mkFlake());
}
function mkFlake(resetY) {
  return {
    x: (Math.random()-0.5)*W*2.2,
    y: resetY ? -H*0.6 - Math.random()*H*0.4 : (Math.random()-0.5)*H*2,
    z: (Math.random()-0.5)*500,
    r: 0.6 + Math.random()*2.2,
    speed: 0.4 + Math.random()*1.1,
    drift: (Math.random()-0.5)*0.5,
  };
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(255,255,255,0.055)';
  ctx.lineWidth = 0.5;
  const step = Math.min(W,H)*0.12;
  const RANGE = Math.max(W,H)*0.7;
  for (let i = -RANGE; i <= RANGE; i += step) {
    const floorY = H*0.38;
    const [x1,y1,z1] = applyCamera(i, floorY, -RANGE);
    const [x2,y2,z2] = applyCamera(i, floorY,  RANGE);
    const p1 = project(x1,y1,z1), p2 = project(x2,y2,z2);
    ctx.beginPath(); ctx.moveTo(p1.sx,p1.sy); ctx.lineTo(p2.sx,p2.sy); ctx.stroke();
    const [x3,y3,z3] = applyCamera(-RANGE, floorY, i);
    const [x4,y4,z4] = applyCamera( RANGE, floorY, i);
    const p3 = project(x3,y3,z3), p4 = project(x4,y4,z4);
    ctx.beginPath(); ctx.moveTo(p3.sx,p3.sy); ctx.lineTo(p4.sx,p4.sy); ctx.stroke();
  }
}

function drawSnow() {
  snow.forEach((s,i) => {
    const [rx,ry,rz] = applyCamera(s.x, s.y, s.z);
    const p = project(rx,ry,rz);
    const sc = FOV / (FOV + rz + Math.min(W,H)*0.55);
    const alpha = Math.min(0.95, 0.4 + sc*0.7);
    ctx.beginPath();
    ctx.arc(p.sx, p.sy, Math.max(0.3, s.r*sc*1.3), 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
    s.y += s.speed;
    s.x += s.drift;
    if (s.y > H) snow[i] = mkFlake(true);
  });
}

function drawCube() {
  const verts = getVerts();
  const t = verts.map(([x,y,z]) => {
    let v = rotateY(x,y,z,angle);
    return applyCamera(v[0],v[1],v[2]);
  });
  const p = t.map(([x,y,z]) => project(x,y,z));

  faces.map(f => ({ f, avgZ: f.reduce((s,i)=>s+t[i][2],0)/f.length }))
    .sort((a,b)=>b.avgZ-a.avgZ)
    .forEach(({f}) => {
      ctx.beginPath();
      ctx.moveTo(p[f[0]].sx,p[f[0]].sy);
      f.slice(1).forEach(i=>ctx.lineTo(p[i].sx,p[i].sy));
      ctx.closePath();
      ctx.fillStyle='rgba(255,255,255,0.03)';
      ctx.fill();
    });

  ctx.strokeStyle='rgba(255,255,255,0.93)';
  ctx.lineWidth=1.4;
  ctx.shadowColor='rgba(255,255,255,0.3)';
  ctx.shadowBlur=8;
  edges.forEach(([a,b])=>{
    ctx.beginPath();
    ctx.moveTo(p[a].sx,p[a].sy);
    ctx.lineTo(p[b].sx,p[b].sy);
    ctx.stroke();
  });
  ctx.shadowBlur=0;
}

function loop() {
  ctx.clearRect(0,0,W,H);
  drawGrid();
  drawSnow();
  drawCube();
  angle += 0.022;
  requestAnimationFrame(loop);
}

resize();
loop();
</script>
</body>
</html>
